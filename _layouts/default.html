<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} - {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header>
  <a class="site" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <a class="repo" href="{{ site.repo }}">source on GitHub</a>
</header>
<div class="wrap">
  <nav>
    <ul>
    {% for item in site.nav %}
      <li{% if page.url == item.url %} class="here"{% endif %}><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
    {% endfor %}
    </ul>
  </nav>
  <main>
{{ content }}
  </main>
</div>
</body>
</html>
